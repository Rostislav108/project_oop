[tool.poetry]
name = "project-oop"
version = "0.1.0"
description = "Учебный проект: модель интернет-магазина (ООП)"
authors = ["Rostislav Lotrenko"]
package-mode = false

[tool.isort]
profile = "black"
line_length = 120
known_first_party = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
